<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Horizon · 竖向分区看板原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: var(--b3-theme-background, oklch(98.7% 0.003 230));
      --surface: oklch(99.6% 0.002 230);
      --chrome: var(--b3-theme-surface, oklch(96.5% 0.007 230));
      --text: var(--b3-theme-on-background, oklch(29% 0.014 235));
      --muted: var(--b3-theme-on-surface, oklch(49% 0.018 235));
      --line: var(--b3-border-color, oklch(88% 0.009 230));
      --primary: var(--b3-theme-primary, oklch(53% 0.12 245));
      --primary-soft: color-mix(in oklch, var(--primary) 9%, var(--bg));
      --strength: 15%;
      --lane-inset: 10px;
      --card-line: oklch(86% 0.008 230);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: oklch(22% 0.008 235);
      --surface: oklch(27% 0.009 235);
      --chrome: oklch(25% 0.009 235);
      --text: oklch(91% 0.008 235);
      --muted: oklch(71% 0.013 235);
      --line: oklch(36% 0.012 235);
      --primary: oklch(73% 0.1 245);
      --card-line: oklch(40% 0.012 235);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button, select, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    button { border: 0; background: none; }
    .icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .app-header { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 18px; background: var(--chrome); border-bottom: 1px solid var(--line); }
    .app-mark { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.3px; }
    .app-mark .icon { width: 21px; height: 21px; color: var(--primary); }
    .header-divider { height: 16px; width: 1px; background: var(--line); }
    .breadcrumb { color: var(--muted); display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .breadcrumb strong { color: var(--text); font-weight: 500; }
    .prototype-label { font-size: 11px; border: 1px solid var(--line); color: var(--muted); padding: 1px 6px; border-radius: 4px; }
    .header-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
    .comparison { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
    .comparison button { min-height: 28px; padding: 3px 12px; border-radius: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .comparison button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 5px; color: var(--muted); }
    .icon-button:hover { color: var(--text); background: color-mix(in oklch, var(--text) 6%, transparent); }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-height: 55px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
    [data-layout="lanes"] .toolbar { border-bottom: 0; }
    .toolbar-label { color: var(--muted); font-size: 12px; }
    .context-select { display: inline-flex; align-items: center; gap: 8px; font-weight: 550; white-space: nowrap; }
    .select-value { padding: 3px 9px; border: 1px solid var(--line); border-radius: 5px; font-weight: 400; background: var(--surface); }
    .select-value .icon { width: 13px; height: 13px; display: inline; vertical-align: -2px; margin-left: 10px; }
    .task-total { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .toolbar-right { margin-inline-start: auto; display: flex; align-items: center; gap: 14px; }
    .view-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    .view-label .icon { color: var(--primary); width: 16px; height: 16px; }
    .search { display: flex; align-items: center; gap: 6px; color: var(--muted); padding: 4px 9px; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; }
    .search .icon { width: 15px; height: 15px; }
    .search input { border: 0; background: none; outline: none; width: 120px; font-size: 12px; min-width: 0; }
    .search:focus-within { outline: 2px solid var(--primary); outline-offset: 1px; }
    .search input:focus-visible { outline: none; }
    .search input::placeholder { color: var(--muted); opacity: 1; }
    .board-nav { display: none; min-width: 0; flex: 0 0 44px; background: var(--bg); }
    .board-tabs { position: relative; display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; height: 44px; padding: 0 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; touch-action: pan-x; }
    .board-tabs::-webkit-scrollbar { display: none; }
    .board-tab-indicator { position: absolute; z-index: 0; left: 0; top: 6px; width: var(--tab-width, 0px); height: 32px; border-radius: 999px; background: var(--primary-soft); transform: translateX(var(--tab-left, 0px)); pointer-events: none; transition: transform 190ms cubic-bezier(.22, 1, .36, 1); }
    .board-tab { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; flex: 0 0 auto; padding: 0 12px; color: var(--tab-ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .board-tab[aria-selected="true"] { color: var(--primary); }
    .board-tab-count { font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .board-tab .icon { width: 13px; height: 13px; }
    .board-tab:focus-visible { outline-offset: -4px; border-radius: 999px; }
    [data-theme="dark"] .board-tab { --tab-ink: color-mix(in oklab, var(--tab-color) 55%, var(--text)) !important; }
    .board-scroll { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; }
    .board { --expanded-track: minmax(290px, 1fr); --expanded-min: 290px; --collapsed-width: 52px; --board-extra: 0px; position: relative; isolation: isolate; overflow: clip; display: grid; grid-template-columns: var(--lane-tracks, repeat(4, var(--expanded-track))); min-width: calc(var(--open-count, 4) * var(--expanded-min) + var(--collapsed-count, 0) * var(--collapsed-width) + var(--board-extra)); height: 100%; align-items: stretch; }
    .lane { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .board-background { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .board-color-probe { position: absolute; width: 0; height: 0; visibility: hidden; }
    .lane-progress { flex: 0 0 4px; height: 4px; border-radius: 999px; overflow: hidden; background: color-mix(in oklab, var(--lane-color) 24%, var(--bg)); }
    .lane-progress > span { display: block; width: calc(var(--completion) * 100%); height: 100%; border-radius: inherit; background: color-mix(in oklab, var(--lane-color) 75%, var(--lane-ink)); }
    .lane--collapsed { align-self: start; }
    .lane-collapsed { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; padding: 16px 0 24px; border-radius: 0; color: var(--lane-ink); text-align: center; }
    .lane-collapsed > .icon { width: 17px; height: 17px; }
    .lane-collapsed:hover > .icon { color: var(--text); }
    .lane-collapsed:focus-visible { outline-offset: -3px; }
    .lane-collapsed-title { writing-mode: vertical-rl; text-orientation: upright; font-size: 15px; font-weight: 600; letter-spacing: 3px; }
    .lane-collapsed-progress { font-size: 10px; font-variant-numeric: tabular-nums; }
    .lane-content { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--lane-inset); }
    .lane-heading { flex: 0 0 auto; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; color: var(--lane-ink); }
    .lane-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; scrollbar-width: none; }
    .lane-body::-webkit-scrollbar { display: none; }
    .lane-items { padding-bottom: 12px; }
    .lane-heading h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .1px; }
    .lane-emoji { font-size: 17px; }
    .count { display: inline-flex; align-items: center; justify-content: center; min-width: 21px; height: 21px; padding: 0 5px; font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 550; border-radius: 5px; background: color-mix(in oklch, var(--bg) 70%, transparent); }
    .lane-heading > .icon-button { margin-inline-start: auto; color: var(--lane-ink); }
    .lane-heading .icon-button + .icon-button { margin-inline-start: -4px; }
    .lane-heading > .icon-button:disabled { opacity: .4; cursor: default; }
    .lane-completion { margin-inline-start: auto; font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 500; }
    [data-layout="lanes"] .lane-completion + .icon-button { margin-inline-start: 0; }
    .group + .group { margin-top: 12px; }
    .group-heading { display: flex; align-items: center; min-height: 35px; gap: 6px; padding: 0 6px; }
    .group-toggle { display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 32px; text-align: left; padding: 0; }
    .group-toggle > .icon { width: 14px; height: 14px; color: var(--muted); transition: transform 160ms ease-out; }
    .group-toggle[aria-expanded="false"] > .icon { transform: rotate(-90deg); }
    .heading-marker { color: var(--muted); font-size: 12px; font-weight: 500; }
    .group-name { font-size: 13px; font-weight: 600; }
    .group-heading .count { font-size: 11px; min-width: 19px; height: 19px; margin-left: 1px; }
    .group-heading > .icon-button { margin-inline-start: auto; color: var(--lane-ink); width: 27px; height: 27px; }
    .tasks { display: flex; flex-direction: column; gap: 6px; }
    .task { min-width: 0; background: var(--surface); border: 1px solid var(--card-line); border-radius: 7px; box-shadow: 0 1px 2px color-mix(in oklch, var(--text) 5%, transparent); cursor: grab; }
    .task:hover { border-color: color-mix(in oklab, var(--lane-color) 45%, var(--card-line)); }
    .task.dragging { opacity: .35; }
    .task-main { display: flex; align-items: flex-start; gap: 9px; padding: 11px 10px; }
    .check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; margin-top: 2px; color: var(--surface); background: none; }
    .check .icon { width: 12px; height: 12px; stroke-width: 2.3; opacity: 0; }
    .check[aria-pressed="true"] { background: var(--lane-ink); border-color: var(--lane-ink); }
    .check[aria-pressed="true"] .icon { opacity: 1; }
    .task-title { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.55; font-size: 15px; }
    .task.done .task-title { color: var(--muted); text-decoration: line-through; }
    .task-menu { margin: -3px -4px -3px 0; height: 26px; width: 24px; flex: 0 0 auto; }
    .task-menu .icon { width: 16px; height: 16px; }
    .subtasks { padding: 0 10px 7px; }
    .subtask-summary { display: flex; align-items: center; gap: 6px; width: 100%; padding: 0 0 7px; font-size: 12px; }
    .subtask-summary .icon { width: 14px; height: 14px; }
    .subtask-summary .sub-count { margin-inline-start: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .subtask-summary > .chevron { margin-left: 4px; transition: transform 160ms ease-out; }
    .subtask-summary[aria-expanded="false"] > .chevron { transform: rotate(-90deg); }
    .progress { height: 3px; border-radius: 3px; background: var(--line); margin-bottom: 6px; overflow: hidden; }
    .progress > span { display: block; width: var(--progress); height: 100%; background: color-mix(in oklab, var(--lane-color) 70%, var(--primary)); }
    .subtask-row { display: flex; align-items: flex-start; gap: 9px; padding: 8px 5px; font-size: 14px; }
    .subtask-row.done { color: var(--muted); }
    .subtask-row.done > span { text-decoration: line-through; }
    .subtask-row .check { width: 17px; height: 17px; }
    .add-task { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 36px; margin-top: 9px; padding: 5px 10px; color: var(--lane-ink); font-size: 12px; border-radius: 5px; opacity: .78; text-align: left; }
    .add-task .icon { width: 15px; height: 15px; }
    .add-task:hover { opacity: 1; background: color-mix(in oklch, var(--lane-color) 8%, transparent); }
    .composer { margin-top: 8px; border: 1px solid var(--primary); border-radius: 6px; padding: 9px; background: var(--surface); }
    .composer input { border: 0; background: none; width: 100%; min-height: 30px; outline: none; font-size: 14px; }
    .composer-actions { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 12px; }
    .small-button { min-height: 28px; padding: 3px 9px; border-radius: 4px; }
    .small-button:hover { background: var(--chrome); }
    .primary-button { background: var(--primary); color: var(--surface); }
    .primary-button:hover { background: color-mix(in oklch, var(--primary) 88%, var(--text)); }
    .lane.drop-target { background: color-mix(in oklch, var(--primary) 7%, transparent); outline: 2px dashed var(--primary); outline-offset: -4px; }
    .empty { font-size: 12px; padding: 12px 10px; color: var(--muted); }
    .footer { min-height: 31px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; background: var(--bg); }
    .footer-detail { display: flex; align-items: center; gap: 12px; }
    .footer-detail span + span { border-inline-start: 1px solid var(--line); padding-inline-start: 12px; }
    .width-value { color: var(--primary); font-variant-numeric: tabular-nums; }
    /* Baseline comparison keeps exactly the same task typography and content. */
    [data-layout="old"] .board { --board-extra: 60px; padding: 12px; gap: 12px; }
    [data-layout="old"] .lane { border: 0; }
    [data-layout="old"] .board-background { display: none; }
    [data-layout="old"] .lane-progress, [data-layout="old"] .lane-completion { display: none; }
    [data-layout="old"] .lane--collapsed .lane-progress { display: block; }
    [data-layout="old"] .lane-content { flex: 0 1 auto; max-height: 100%; border-radius: 12px; padding: 0 10px 8px; background: color-mix(in oklab, var(--lane-color) var(--strength), var(--bg)); }
    [data-layout="old"] .lane-heading { min-height: 44px; padding-inline: 4px; }
    .popover { position: fixed; z-index: 10; margin: 0; inset: 54px 14px auto auto; width: 276px; border: 1px solid var(--line); border-radius: 8px; padding: 16px; background: var(--surface); color: var(--text); box-shadow: 0 8px 30px color-mix(in oklch, var(--text) 12%, transparent); }
    .popover h3 { font-size: 13px; margin: 0 0 15px; font-weight: 600; }
    .setting { display: grid; grid-template-columns: 1fr auto; gap: 9px; font-size: 12px; margin-bottom: 15px; }
    .setting output { color: var(--muted); font-variant-numeric: tabular-nums; }
    .setting input { width: 100%; grid-column: 1 / -1; accent-color: var(--primary); margin: 0; }
    .setting-note { color: var(--muted); font-size: 11px; line-height: 1.7; margin: 0; }
    .reset-button { font-size: 12px; color: var(--primary); padding: 9px 0 0; }
    .action-menu { z-index: 20; position: fixed; margin: 0; inset: auto; width: 210px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); box-shadow: 0 8px 24px color-mix(in oklch, var(--text) 12%, transparent); }
    .action-menu p { margin: 3px 7px 6px; font-size: 11px; color: var(--muted); }
    .action-menu button { display: block; width: 100%; min-height: 32px; padding: 5px 8px; text-align: left; font-size: 12px; border-radius: 4px; }
    .action-menu button:hover { background: var(--chrome); }
    .action-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
    .toast { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 30; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); box-shadow: 0 4px 16px color-mix(in oklch, var(--text) 10%, transparent); font-size: 12px; }
    [data-theme="dark"] .lane { --lane-ink: color-mix(in oklab, var(--lane-color) 55%, var(--text)) !important; }
    @media (max-width: 1159px) {
      .board-nav { display: flex; }
      .board { --expanded-min: max(290px, calc(100vw - 34px)); --expanded-track: minmax(290px, calc(100vw - 34px)); }
      .board-scroll { scroll-snap-type: x proximity; }
      .lane { scroll-snap-align: center; }
    }
    @media (max-width: 760px) {
      .app-header { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
      .breadcrumb, .header-divider { display: none; }
      .app-mark { font-size: 13px; }
      .prototype-label { font-size: 10px; }
      .header-actions { gap: 3px; }
      .comparison button { padding-inline: 7px; font-size: 11px; min-height: 32px; }
      .toolbar { padding: 8px 10px; gap: 8px; }
      .context-select { font-size: 12px; gap: 5px; }
      .toolbar-right { width: 100%; justify-content: space-between; }
      .search { flex: 1; max-width: 230px; }
      .search input { width: 100%; min-height: 25px; }
      .icon-button { width: 36px; height: 36px; }
      .group-heading > .icon-button { width: 36px; height: 36px; }
      .check { position: relative; }
      .check::after { content: ""; position: absolute; inset: -10px; }
      .task-main { padding-block: 13px; }
      .task-menu { width: 28px; height: 28px; }
      .group-toggle { min-height: 40px; }
      .add-task { min-height: 44px; }
      .footer { padding-inline: 10px; }
      .footer-tip { display: none; }
      .footer-detail { gap: 8px; }
      .footer-detail span + span { padding-inline-start: 8px; }
      .popover { top: 60px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">

  </svg>
  <div class="app">
    <header class="app-header">
      <div class="app-mark"><svg class="icon"><use href="#i-board"/></svg>Task Horizon</div>
      <span class="header-divider"></span>
      <div class="breadcrumb">示例空间 <span>/</span> <strong>项目看板</strong></div>
      <span class="prototype-label">原型</span>
      <div class="header-actions">
        <div class="comparison" role="group" aria-label="看板样式对比">
          <button type="button" data-layout-choice="lanes" aria-pressed="true">竖向分区</button>
          <button type="button" data-layout-choice="old" aria-pressed="false">卡片样式</button>
        </div>
        <button class="icon-button" id="theme-toggle" aria-label="切换到深色主题" title="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
        <button class="icon-button" popovertarget="settings" aria-label="显示设置" title="显示设置"><svg class="icon"><use href="#i-settings"/></svg></button>
      </div>
    </header>
    <div class="toolbar">
      <div class="context-select"><span class="toolbar-label">文档</span><span class="select-value">演示项目</span></div>
      <div class="context-select"><span class="toolbar-label">规则</span><span class="select-value">时长</span></div>
      <span class="task-total" id="task-total"></span>
      <span class="header-divider"></span>
      <div class="context-select"><span class="toolbar-label">分组</span><span class="select-value">按文档</span></div>
      <div class="toolbar-right">
        <span class="view-label"><svg class="icon"><use href="#i-board"/></svg>看板</span>
        <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索任务" aria-label="搜索任务"></label>
      </div>
    </div>
    <nav class="board-nav" aria-label="看板切换"><div class="board-tabs" id="board-tabs" role="tablist" aria-label="看板页签"></div></nav>
    <main class="board-scroll" aria-label="任务看板">
      <div class="board" id="board"></div>
    </main>
    <footer class="footer">
      <div class="footer-detail"><span id="layout-description">竖向分区 · 内容自适应渐变</span><span>卡片宽度 <b class="width-value" id="card-width"></b></span><span id="inset-description">左右留白 10px</span></div>
      <span class="footer-tip">拖动卡片可移动到其他分区</span>
    </footer>
  </div>
  <aside class="popover" id="settings" popover aria-label="显示设置">
    <h3>显示设置</h3>
    <label class="setting" for="strength">分区颜色浓度<output id="strength-output">15%</output><input type="range" id="strength" min="6" max="30" value="15"></label>
    <label class="setting" for="inset">卡片左右留白<output id="inset-output">10px</output><input type="range" id="inset" min="4" max="16" value="10" step="1"></label>
    <p class="setting-note">渐变覆盖当前列的任务内容，并在末尾自然淡出。新增、移动或折叠任务时自动更新。</p>
    <button class="reset-button" id="reset">恢复示例</button>
  </aside>
  <div class="action-menu" id="action-menu" popover aria-label="任务操作"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const sample = [
      { id: 'planning', name: '需求规划', emoji: '📝', color: 'oklch(65% .12 120)', ink: 'oklch(43% .09 120)', groups: [
        { id: 'planning-research', name: '需求调研', tasks: [{ id: 'research', title: '整理示例用户反馈', done: true }] },
        { id: 'planning-scope', name: '本期范围', tasks: [
          { id: 'scope', title: '明确新版本功能范围', expanded: true, subtasks: [ { id: 'scope-1', title: '汇总待评估需求', done: true }, { id: 'scope-2', title: '划分优先级与交付批次' }, { id: 'scope-3', title: '完成范围评审' } ] },
          { id: 'roadmap', title: '更新项目路线图与交付节点' },
          { id: 'criteria', title: '补充功能验收标准' }
        ] },
        { id: 'planning-backlog', name: '后续迭代', tasks: [{ id: 'backlog', title: '归档后续迭代建议' }] }
      ] },
      { id: 'design', name: '体验设计', emoji: '🎨', color: 'oklch(65% .1 160)', ink: 'oklch(43% .08 160)', groups: [
        { id: 'design-review', name: '设计评审', tasks: [{ id: 'prototype', title: '评审新版导航交互原型' }] }
      ] },
      { id: 'development', name: '功能开发', emoji: '🛠️', color: 'oklch(65% .09 185)', ink: 'oklch(43% .07 185)', groups: [
        { id: 'development-components', name: '组件实现', tasks: [{ id: 'navigation', title: '完成导航组件基础结构', done: true }, { id: 'form-states', title: '补充表单校验与空状态' }] },
        { id: 'development-integration', name: '联调验收', tasks: [{ id: 'integration', title: '验证列表筛选与分页交互' }] }
      ] },
      { id: 'release', name: '发布准备', emoji: '🚀', color: 'oklch(66% .09 15)', ink: 'oklch(44% .08 15)', groups: [
        { id: 'release-checks', name: '发布检查', tasks: [
          { id: 'regression', title: '检查桌面与移动端的主要流程和边界状态' },
          { id: 'release-notes', title: '整理版本说明与功能截图' },
          { id: 'assets', title: '确认演示素材与示例数据', done: true },
          { id: 'test-build', title: '完成测试版本打包', done: true }
        ] },
        { id: 'release-guide', name: '使用指南', tasks: [{ id: 'guide', title: '补充新功能操作示例与常见问题说明' }] }
      ] }
    ];
    let lanes = structuredClone(sample);
    let query = '';
    let dragId = null;
    let nextId = 1;
    let toastTimer;
    const collapsedGroups = new Set();
    const collapsedLanes = new Set();
    const board = document.getElementById('board');
    const boardScroll = document.querySelector('.board-scroll');
    const boardTabs = document.getElementById('board-tabs');
    const narrowScreen = matchMedia('(max-width: 1159px)');
    let activeLaneId = sample[0].id;
    let pendingNavId = null;
    let navScrollFrame = 0;
    const menu = document.getElementById('action-menu');
    const allTasks = () => lanes.flatMap(lane => lane.groups.flatMap(group => group.tasks));
    const findTask = id => allTasks().find(task => task.id === id);
    const checkButton = (id, title, done, sub = false) => `<button class="check" type="button" data-${sub ? 'subcheck' : 'check'}="${escapeHtml(id)}" aria-label="${escapeHtml(title)}：完成状态" aria-pressed="${Boolean(done)}">${icon('check')}</button>`;

    function renderBoardTabs() {
      boardTabs.innerHTML = '<span class="board-tab-indicator" aria-hidden="true"></span>' + lanes.map(lane => {
        const count = lane.groups.reduce((sum, group) => sum + group.tasks.length, 0);
        const folded = collapsedLanes.has(lane.id);
        return `<button class="board-tab" id="board-tab-${lane.id}" type="button" role="tab" data-nav-lane="${lane.id}" aria-controls="lane-${lane.id}" aria-selected="${activeLaneId === lane.id}" tabindex="${activeLaneId === lane.id ? 0 : -1}" title="${lane.name}${folded ? '（已折叠）' : ''}" style="--tab-color:${lane.color};--tab-ink:${lane.ink}">${lane.name}<span class="board-tab-count">${count}</span>${folded ? icon('collapse') : ''}</button>`;
      }).join('');
    }

    function setActiveBoardTab(id) {
      const changed = activeLaneId !== id;
      activeLaneId = id;
      boardTabs.querySelectorAll('[data-nav-lane]').forEach(tab => {
        const selected = tab.dataset.navLane === id;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      if (!narrowScreen.matches) return;
      const active = boardTabs.querySelector(`[data-nav-lane="${id}"]`);
      boardTabs.style.setProperty('--tab-left', `${active.offsetLeft}px`);
      boardTabs.style.setProperty('--tab-width', `${active.offsetWidth}px`);
      if (changed || active.offsetLeft < boardTabs.scrollLeft || active.offsetLeft + active.offsetWidth > boardTabs.scrollLeft + boardTabs.clientWidth) {
        boardTabs.scrollTo({left: Math.max(0, active.offsetLeft - (boardTabs.clientWidth - active.offsetWidth) / 2), behavior: 'auto'});
      }
    }

    function laneScrollPosition(lane) {
      const scrollerRect = boardScroll.getBoundingClientRect();
      const laneRect = lane.getBoundingClientRect();
      const target = boardScroll.scrollLeft + laneRect.left - scrollerRect.left + (laneRect.width - boardScroll.clientWidth) / 2;
      return Math.max(0, Math.min(boardScroll.scrollWidth - boardScroll.clientWidth, target));
    }

    function syncBoardTabs() {
      if (pendingNavId) { setActiveBoardTab(pendingNavId); return; }
      if (!narrowScreen.matches) return;
      let nearest;
      let distance = Infinity;
      board.querySelectorAll('.lane').forEach(lane => {
        const currentDistance = Math.abs(laneScrollPosition(lane) - boardScroll.scrollLeft);
        if (currentDistance < distance) { nearest = lane.dataset.lane; distance = currentDistance; }
      });
      if (nearest) setActiveBoardTab(nearest);
    }

    function jumpToLane(id) {
      pendingNavId = id;
      setActiveBoardTab(id);
      requestAnimationFrame(() => {
        if (pendingNavId !== id) return;
        const lane = board.querySelector(`[data-lane="${id}"]`);
        if (narrowScreen.matches) boardScroll.scrollTo({left: laneScrollPosition(lane), behavior: 'auto'});
        pendingNavId = null;
        setActiveBoardTab(id);
      });
    }

    function taskHtml(task) {
      const completed = task.subtasks?.filter(sub => sub.done).length || 0;
      const subHtml = task.subtasks ? `<div class="subtasks">
        <button class="subtask-summary" type="button" data-subtoggle="${task.id}" aria-expanded="${task.expanded}" aria-controls="subtasks-${task.id}">${icon('clipboard')}子任务<span class="sub-count">${completed}/${task.subtasks.length}</span><span class="chevron">${icon('chevron')}</span></button>
        <div class="progress" role="progressbar" aria-label="子任务完成进度" aria-valuemin="0" aria-valuemax="${task.subtasks.length}" aria-valuenow="${completed}" style="--progress:${completed / task.subtasks.length * 100}%"><span></span></div>
        <div id="subtasks-${task.id}" ${task.expanded ? '' : 'hidden'}>${task.subtasks.map(sub => `<div class="subtask-row${sub.done ? ' done' : ''}">${checkButton(sub.id, sub.title, sub.done, true)}<span>${escapeHtml(sub.title)}</span></div>`).join('')}</div>
      </div>` : '';
      return `<article class="task${task.done ? ' done' : ''}" draggable="true" data-task="${task.id}" aria-label="${escapeHtml(task.title)}">
        <div class="task-main">${checkButton(task.id, task.title, task.done)}<span class="task-title">${escapeHtml(task.title)}</span><button class="icon-button task-menu" type="button" data-menu="${task.id}" aria-label="任务操作：${escapeHtml(task.title)}" title="任务操作">${icon('more')}</button></div>${subHtml}</article>`;
    }

    function render() {
      renderBoardTabs();
      board.style.setProperty('--lane-tracks', lanes.map(lane => collapsedLanes.has(lane.id) ? 'var(--collapsed-width)' : 'var(--expanded-track)').join(' '));
      board.style.setProperty('--open-count', lanes.length - collapsedLanes.size);
      board.style.setProperty('--collapsed-count', collapsedLanes.size);
      board.innerHTML = '<canvas class="board-background" aria-hidden="true"></canvas><span class="board-color-probe" aria-hidden="true"></span>' + lanes.map(lane => {
        const laneTasks = lane.groups.flatMap(group => group.tasks);
        const count = laneTasks.length;
        const completed = laneTasks.filter(task => task.done).length;
        const percent = count ? Math.round(completed / count * 100) : 0;
        const progressLabel = count ? `已完成 ${completed}/${count} 个任务（${percent}%）` : '暂无任务';
        const laneCollapsed = collapsedLanes.has(lane.id);
        let visibleCount = 0;
        const groups = lane.groups.map(group => {
          const visibleTasks = group.tasks.filter(task => !query || (task.title + ' ' + (task.subtasks || []).map(sub => sub.title).join(' ')).toLocaleLowerCase().includes(query));
          visibleCount += visibleTasks.length;
          if (query && !visibleTasks.length) return '';
          const collapsed = collapsedGroups.has(group.id);
          return `<section class="group" data-group="${group.id}"><div class="group-heading"><button class="group-toggle" type="button" data-toggle="${group.id}" aria-expanded="${!collapsed}" aria-controls="tasks-${group.id}">${icon('chevron')}<span class="heading-marker">H</span><span class="group-name">${escapeHtml(group.name)}</span><span class="count">${visibleTasks.length}</span></button><button class="icon-button" type="button" data-add="${group.id}" aria-label="添加任务到${escapeHtml(group.name)}" title="添加任务">${icon('plus')}</button></div><div class="tasks" id="tasks-${group.id}" ${collapsed ? 'hidden' : ''}>${visibleTasks.map(taskHtml).join('')}</div></section>`;
        }).join('');
        return `<section class="lane${laneCollapsed ? ' lane--collapsed' : ''}" id="lane-${lane.id}" data-lane="${lane.id}" aria-label="${escapeHtml(lane.name)}分区" style="--lane-color:${lane.color};--lane-ink:${lane.ink}">
          <div class="lane-progress" role="progressbar" aria-label="${lane.name}完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" aria-valuetext="${progressLabel}" title="${progressLabel}" style="--completion:${count ? completed / count : 0}"><span></span></div>
          <button class="lane-collapsed" type="button" data-expand-lane="${lane.id}" aria-label="展开看板：${lane.name}" aria-expanded="false" aria-controls="lane-content-${lane.id}" title="展开看板：${lane.name}" ${laneCollapsed ? '' : 'hidden'}>
            ${icon('expand')}<span class="lane-emoji" aria-hidden="true">${lane.emoji}</span><span class="lane-collapsed-title">${lane.name}</span><span class="count">${count}</span><span class="lane-collapsed-progress" title="${progressLabel}">${percent}%</span>
          </button>
          <div class="lane-content" id="lane-content-${lane.id}" ${laneCollapsed ? 'hidden' : ''}><header class="lane-heading"><span class="lane-emoji" aria-hidden="true">${lane.emoji}</span><h2>${lane.name}</h2><span class="count">${count}</span><span class="lane-completion" title="${progressLabel}">${percent}%</span><button class="icon-button" type="button" data-add="${lane.groups[0].id}" aria-label="添加任务到${lane.name}" title="添加任务">${icon('plus')}</button><button class="icon-button" type="button" data-collapse-lane="${lane.id}" aria-label="折叠看板：${lane.name}" aria-expanded="true" aria-controls="lane-content-${lane.id}" title="折叠看板：${lane.name}">${icon('collapse')}</button></header><div class="lane-body" tabindex="0" role="region" aria-label="${lane.name}任务列表"><div class="lane-items">${groups}${query && !visibleCount ? '<p class="empty">没有匹配的任务</p>' : ''}<button class="add-task" type="button" data-add="${lane.groups[0].id}">${icon('plus')}添加任务</button></div></div></div>
        </section>`;
      }).join('');
      document.getElementById('task-total').textContent = `${allTasks().length} 个任务`;
      board.querySelectorAll('.lane:not(.lane--collapsed) .lane-items, .lane:not(.lane--collapsed) .lane-heading').forEach(content => resizeObserver.observe(content));
      requestAnimationFrame(updateGeometry);
    }

    // Measure actual content rather than multiplying card count by a fixed height:
    // wrapping titles, subtasks and collapsed groups should all affect the fade.
    function updateGeometry() {
      board.querySelectorAll('.lane').forEach(lane => {
        if (lane.classList.contains('lane--collapsed')) return;
        const items = lane.querySelector('.lane-items');
        const header = lane.querySelector('.lane-heading');
        lane.style.setProperty('--fade-height', `${Math.ceil(items.getBoundingClientRect().height + header.getBoundingClientRect().height + 100)}px`);
      });
      const card = [...board.querySelectorAll('.task')].find(item => item.getBoundingClientRect().width > 0);
      document.getElementById('card-width').textContent = card ? `${Math.round(card.getBoundingClientRect().width)}px` : '—';
      paintBoardBackground();
      syncBoardTabs();
    }
    function paintBoardBackground() {
      if (document.body.dataset.layout === 'old') return;
      const canvas = board.querySelector('.board-background');
      const probe = board.querySelector('.board-color-probe');
      const origin = board.getBoundingClientRect();
      canvas.width = Math.min(8192, Math.max(1, Math.ceil(origin.width)));
      canvas.height = Math.max(1, Math.ceil(origin.height));
      const scale = canvas.width / Math.max(1, origin.width);
      const paint = canvas.getContext('2d');
      const resolveColor = value => { probe.style.color = value; return getComputedStyle(probe).color; };
      const base = resolveColor('var(--bg)');
      const strength = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--strength')) || 15) / 100;
      paint.setTransform(scale, 0, 0, 1, 0, 0);
      paint.fillStyle = base;
      paint.fillRect(0, 0, origin.width, canvas.height);
      const columns = Array.from(board.querySelectorAll('.lane')).map(lane => {
        const rect = lane.getBoundingClientRect();
        const folded = lane.classList.contains('lane--collapsed');
        return { left: rect.left - origin.left, width: rect.width, folded,
          height: folded ? rect.height : Math.min(rect.height, parseFloat(lane.style.getPropertyValue('--fade-height')) || rect.height),
          color: getComputedStyle(lane).getPropertyValue('--lane-color') };
      });
      const last = columns[columns.length-1];
      if (last && last.left+last.width<origin.width) columns.push({left:last.left+last.width,width:origin.width-last.left-last.width,height:canvas.height,color:base,folded:false,outerEdge:true});
      const strips = columns.map(column => {
        const strip = document.createElement('canvas');
        strip.width = 1; strip.height = canvas.height;
        const context = strip.getContext('2d');
        context.fillStyle = resolveColor(column.color);
        context.fillRect(0, 0, 1, column.height);
        const fade = context.createLinearGradient(0, 0, 0, Math.max(1, column.height));
        [[0, 2/3], [Math.min(.38, 10/Math.max(1,column.height)), 1], [.38, 5/9], [.74, 2/9], [1, 0]]
          .forEach(([position, alpha]) => fade.addColorStop(position, `rgba(255,255,255,${strength*alpha})`));
        context.globalCompositeOperation = 'destination-in'; context.fillStyle = fade; context.fillRect(0,0,1,canvas.height);
        context.globalCompositeOperation = 'destination-over'; context.fillStyle = base; context.fillRect(0,0,1,canvas.height);
        paint.drawImage(strip,0,0,1,canvas.height,column.left,0,column.width,canvas.height);
        return strip;
      });
      columns.slice(0,-1).forEach((left,index) => {
        const right = columns[index+1];
        const folded = left.folded || right.folded;
        const half = Math.min(right.outerEdge ? (folded ? 8 : 14) : (folded ? 12 : 28), left.width/2, right.width/2);
        const start = right.left-half, width = half*2, step = 1/scale;
        paint.drawImage(strips[index+1],0,0,1,canvas.height,start,0,width,canvas.height);
        for(let x=0;x<width;x+=step) {
          paint.globalAlpha = Math.max(0,1-(x+step/2)/width);
          paint.drawImage(strips[index],0,0,1,canvas.height,start+x,0,Math.min(step,width-x),canvas.height);
        }
        paint.globalAlpha = 1;
      });
    }
    const resizeObserver = new ResizeObserver(updateGeometry);

    function refresh(focusSelector) {
      const scrollPositions = new Map([...board.querySelectorAll('.lane')].map(lane => [lane.dataset.lane, lane.querySelector('.lane-body')?.scrollTop || 0]));
      resizeObserver.disconnect();
      render();
      board.querySelectorAll('.lane-body').forEach(body => { body.scrollTop = scrollPositions.get(body.closest('.lane').dataset.lane) || 0; });
      if (focusSelector) board.querySelector(focusSelector)?.focus({preventScroll: true});
    }

    function notify(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2000);
    }

    function setLayout(layout) {
      document.body.dataset.layout = layout;
      document.querySelectorAll('[data-layout-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.layoutChoice === layout)));
      document.getElementById('layout-description').textContent = layout === 'lanes' ? '竖向分区 · 内容自适应渐变' : '卡片样式 · 固定底色';
      document.getElementById('inset-description').textContent = layout === 'lanes' ? `左右留白 ${document.getElementById('inset').value}px` : '列间距 12px · 内边距 10px';
      requestAnimationFrame(updateGeometry);
    }

    function openComposer(groupId) {
      if (query) { query = ''; document.getElementById('search').value = ''; refresh(); }
      board.querySelector('.composer')?.remove();
      const group = lanes.flatMap(lane => lane.groups).find(item => item.id === groupId);
      const groupEl = board.querySelector(`[data-group="${groupId}"]`);
      if (!groupEl) return;
      if (collapsedGroups.delete(groupId)) {
        groupEl.querySelector('.group-toggle').setAttribute('aria-expanded', 'true');
        groupEl.querySelector('.tasks').hidden = false;
      }
      const form = document.createElement('form');
      form.className = 'composer';
      form.innerHTML = '<input name="title" aria-label="新任务标题" placeholder="输入任务内容…" autocomplete="off" required maxlength="500"><div class="composer-actions"><button class="small-button primary-button" type="submit">添加</button><button class="small-button" type="button" data-cancel>取消</button></div>';
      groupEl.append(form);
      form.querySelector('input').focus();
      form.onsubmit = event => {
        event.preventDefault();
        const title = form.elements.title.value.trim();
        if (!title) return;
        group.tasks.push({ id: `new-${nextId++}`, title });
        if (query) { query = ''; document.getElementById('search').value = ''; }
        refresh(`[data-add="${groupId}"]`);
        notify('已添加任务，渐变范围已更新');
      };
      form.querySelector('[data-cancel]').onclick = () => { form.remove(); groupEl.querySelector('[data-add]')?.focus(); };
      form.onkeydown = event => { if (event.key === 'Escape') { event.stopPropagation(); form.remove(); groupEl.querySelector('[data-add]')?.focus(); } };
    }

    function moveTask(taskId, laneId, groupId) {
      let task;
      lanes.forEach(lane => lane.groups.forEach(group => {
        const index = group.tasks.findIndex(item => item.id === taskId);
        if (index !== -1) task = group.tasks.splice(index, 1)[0];
      }));
      if (!task) return;
      const destination = lanes.find(lane => lane.id === laneId);
      const group = destination.groups.find(item => item.id === groupId) || destination.groups[0];
      group.tasks.push(task);
      collapsedGroups.delete(group.id);
      collapsedLanes.delete(destination.id);
      refresh(`[data-menu="${taskId}"]`);
      notify(`已移动到${destination.name}`);
    }

    board.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.collapseLane) {
        collapsedLanes.add(button.dataset.collapseLane);
        refresh(`[data-expand-lane="${button.dataset.collapseLane}"]`);
        if (narrowScreen.matches) jumpToLane(button.dataset.collapseLane);
      } else if (button.dataset.expandLane) {
        collapsedLanes.delete(button.dataset.expandLane);
        refresh(`[data-collapse-lane="${button.dataset.expandLane}"]`);
        if (narrowScreen.matches) jumpToLane(button.dataset.expandLane);
      } else if (button.dataset.check) {
        const task = findTask(button.dataset.check);
        task.done = !task.done;
        refresh(`[data-check="${task.id}"]`);
      } else if (button.dataset.subcheck) {
        const sub = allTasks().flatMap(task => task.subtasks || []).find(item => item.id === button.dataset.subcheck);
        sub.done = !sub.done;
        refresh(`[data-subcheck="${sub.id}"]`);
      } else if (button.dataset.subtoggle) {
        const task = findTask(button.dataset.subtoggle);
        task.expanded = !task.expanded;
        refresh(`[data-subtoggle="${task.id}"]`);
      } else if (button.dataset.toggle) {
        const id = button.dataset.toggle;
        collapsedGroups.has(id) ? collapsedGroups.delete(id) : collapsedGroups.add(id);
        refresh(`[data-toggle="${id}"]`);
      } else if (button.dataset.add) {
        openComposer(button.dataset.add);
      } else if (button.dataset.menu) {
        const taskId = button.dataset.menu;
        const origin = button.closest('.lane').dataset.lane;
        const rect = button.getBoundingClientRect();
        menu.innerHTML = `<p>移动到分区</p>${lanes.filter(lane => lane.id !== origin).map(lane => `<button type="button" data-move="${lane.id}">${lane.emoji} ${lane.name}</button>`).join('')}<hr><button type="button" data-delete>删除任务</button>`;
        menu.style.left = `${Math.max(8, Math.min(rect.right - 210, innerWidth - 218))}px`;
        menu.style.top = `${Math.max(8, Math.min(rect.bottom + 4, innerHeight - 195))}px`;
        menu.showPopover();
        menu.onclick = menuEvent => {
          const action = menuEvent.target.closest('button');
          if (!action) return;
          menu.hidePopover();
          if (action.dataset.move) moveTask(taskId, action.dataset.move);
          else if (action.hasAttribute('data-delete')) {
            lanes.forEach(lane => lane.groups.forEach(group => { group.tasks = group.tasks.filter(task => task.id !== taskId); }));
            refresh(`[data-add="${lanes.find(lane => lane.id === origin).groups[0].id}"]`);
            notify('已删除示例任务');
          }
        };
        menu.querySelector('button').focus();
      }
    });

    board.addEventListener('dragstart', event => {
      if (event.target.closest('button, input, form')) { event.preventDefault(); return; }
      const card = event.target.closest('[data-task]');
      if (!card) return;
      dragId = card.dataset.task;
      event.dataTransfer.setData('text/plain', dragId);
      event.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    board.addEventListener('dragover', event => {
      if (!dragId) return;
      const lane = event.target.closest('.lane');
      if (!lane) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      board.querySelectorAll('.drop-target').forEach(item => { if (item !== lane) item.classList.remove('drop-target'); });
      lane.classList.add('drop-target');
    });
    board.addEventListener('dragleave', event => {
      const lane = event.target.closest('.lane');
      if (lane && !lane.contains(event.relatedTarget)) lane.classList.remove('drop-target');
    });
    board.addEventListener('drop', event => {
      const lane = event.target.closest('.lane');
      if (!lane || !dragId) return;
      event.preventDefault();
      const groupId = event.target.closest('.group')?.dataset.group;
      moveTask(dragId, lane.dataset.lane, groupId);
      dragId = null;
    });
    board.addEventListener('dragend', () => {
      dragId = null;
      board.querySelectorAll('.drop-target, .dragging').forEach(item => item.classList.remove('drop-target', 'dragging'));
    });
    boardTabs.addEventListener('click', event => {
      const tab = event.target.closest('[data-nav-lane]');
      if (!tab) return;
      jumpToLane(tab.dataset.navLane);
      boardTabs.querySelector(`[data-nav-lane="${tab.dataset.navLane}"]`).focus({preventScroll: true});
    });
    boardTabs.addEventListener('keydown', event => {
      const tab = event.target.closest('[data-nav-lane]');
      if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const index = lanes.findIndex(lane => lane.id === tab.dataset.navLane);
      const targetIndex = event.key === 'Home' ? 0 : event.key === 'End' ? lanes.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + lanes.length) % lanes.length;
      jumpToLane(lanes[targetIndex].id);
      boardTabs.querySelector(`[data-nav-lane="${lanes[targetIndex].id}"]`).focus({preventScroll: true});
    });
    boardScroll.addEventListener('scroll', () => {
      if (navScrollFrame) return;
      navScrollFrame = requestAnimationFrame(() => { navScrollFrame = 0; syncBoardTabs(); });
    }, {passive: true});
    window.addEventListener('resize', () => jumpToLane(activeLaneId));
    document.querySelectorAll('[data-layout-choice]').forEach(button => button.onclick = () => setLayout(button.dataset.layoutChoice));
    document.getElementById('search').oninput = event => { query = event.target.value.trim().toLocaleLowerCase(); refresh(); };
    document.getElementById('theme-toggle').onclick = event => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      event.currentTarget.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
      event.currentTarget.innerHTML = icon(dark ? 'sun' : 'moon');
      requestAnimationFrame(updateGeometry);
    };
    document.getElementById('strength').oninput = event => {
      document.documentElement.style.setProperty('--strength', `${event.target.value}%`);
      document.getElementById('strength-output').textContent = `${event.target.value}%`;
      requestAnimationFrame(updateGeometry);
    };
    document.getElementById('inset').oninput = event => {
      document.documentElement.style.setProperty('--lane-inset', `${event.target.value}px`);
      document.getElementById('inset-output').textContent = `${event.target.value}px`;
      setLayout(document.body.dataset.layout);
    };
    document.getElementById('reset').onclick = () => {
      lanes = structuredClone(sample);
      collapsedGroups.clear();
      collapsedLanes.clear();
      activeLaneId = lanes[0].id;
      pendingNavId = null;
      boardScroll.scrollLeft = 0;
      query = '';
      document.getElementById('search').value = '';
      document.getElementById('strength').value = 15;
      document.getElementById('inset').value = 10;
      document.getElementById('strength-output').textContent = '15%';
      document.getElementById('inset-output').textContent = '10px';
      document.documentElement.style.removeProperty('--strength');
      document.documentElement.style.removeProperty('--lane-inset');
      setLayout('lanes');
      refresh();
      document.getElementById('settings').hidePopover();
      notify('已恢复示例');
    };
    render();
  </script>
</body>
</html>
