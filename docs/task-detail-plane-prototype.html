<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Task Horizon 任务详情排版原型</title>
  <style>
    :root {
      --b3-theme-background: oklch(98.5% 0.004 236);
      --b3-theme-surface: oklch(96.5% 0.006 236);
      --b3-theme-surface-light: oklch(93.8% 0.008 236);
      --b3-theme-on-background: oklch(25% 0.018 242);
      --b3-theme-on-surface: oklch(34% 0.017 242);
      --b3-theme-on-surface-light: oklch(56% 0.015 242);
      --b3-theme-primary: oklch(54% 0.14 241);
      --b3-theme-primary-light: oklch(94% 0.027 241);
      --b3-border-color: oklch(89.5% 0.009 236);
      --tm-background: var(--b3-theme-background);
      --tm-surface: var(--b3-theme-surface);
      --tm-surface-strong: var(--b3-theme-surface-light);
      --tm-text: var(--b3-theme-on-background);
      --tm-text-soft: var(--b3-theme-on-surface);
      --tm-muted: var(--b3-theme-on-surface-light);
      --tm-primary: var(--b3-theme-primary);
      --tm-primary-soft: var(--b3-theme-primary-light);
      --tm-border: var(--b3-border-color);
      --tm-border-soft: color-mix(in oklch, var(--tm-border) 66%, transparent);
      --tm-hover: color-mix(in oklch, var(--tm-primary-soft) 52%, var(--tm-background));
      --tm-danger: oklch(57% 0.18 27);
      --tm-danger-soft: oklch(95% 0.026 27);
      --tm-warning: oklch(64% 0.15 63);
      --tm-success: oklch(54% 0.12 154);
      --tm-shadow: 0 24px 70px color-mix(in oklch, var(--tm-text) 11%, transparent);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --b3-theme-background: oklch(22.5% 0.008 242);
      --b3-theme-surface: oklch(26.5% 0.01 242);
      --b3-theme-surface-light: oklch(32% 0.012 242);
      --b3-theme-on-background: oklch(91.5% 0.009 236);
      --b3-theme-on-surface: oklch(83% 0.01 236);
      --b3-theme-on-surface-light: oklch(68% 0.012 236);
      --b3-theme-primary: oklch(69% 0.12 241);
      --b3-theme-primary-light: oklch(32% 0.04 241);
      --b3-border-color: oklch(37% 0.012 242);
      --tm-danger: oklch(70% 0.15 27);
      --tm-danger-soft: oklch(29% 0.04 27);
      --tm-warning: oklch(75% 0.12 70);
      --tm-success: oklch(70% 0.1 154);
      --tm-shadow: 0 28px 76px color-mix(in oklch, oklch(8% 0.01 242) 58%, transparent);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: color-mix(in oklch, var(--tm-surface) 72%, var(--tm-background));
      color: var(--tm-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    button,
    textarea,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    textarea:focus-visible,
    [contenteditable="true"]:focus-visible {
      outline: 2px solid color-mix(in oklch, var(--tm-primary) 38%, transparent);
      outline-offset: 2px;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      width: 16px;
      height: 16px;
      display: block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-frame {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(196px, 1fr) minmax(640px, 820px) minmax(196px, 1fr);
      background:
        linear-gradient(var(--tm-border-soft), var(--tm-border-soft)) 0 52px / 100% 1px no-repeat,
        color-mix(in oklch, var(--tm-surface) 72%, var(--tm-background));
    }

    .ambient-pane {
      min-width: 0;
      padding: 18px 22px;
      color: var(--tm-muted);
      opacity: 0.72;
      pointer-events: none;
      user-select: none;
    }

    .ambient-pane--right {
      display: flex;
      justify-content: flex-end;
    }

    .ambient-mark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 30px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .ambient-dot {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: var(--tm-primary);
      box-shadow: 10px 0 0 color-mix(in oklch, var(--tm-primary) 52%, var(--tm-surface));
    }

    .detail-sheet {
      position: relative;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--tm-background);
      border-inline: 1px solid var(--tm-border-soft);
      box-shadow: var(--tm-shadow);
    }

    .sheet-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 52px;
      padding: 9px clamp(14px, 3.5vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--tm-border-soft);
      background: color-mix(in oklch, var(--tm-background) 94%, transparent);
      backdrop-filter: blur(14px);
    }

    .topbar-leading,
    .topbar-actions,
    .breadcrumb,
    .section-actions {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .topbar-leading {
      gap: 8px;
      overflow: hidden;
    }

    .breadcrumb {
      gap: 5px;
      color: var(--tm-muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }

    .breadcrumb span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumb-link {
      min-width: 0;
      padding: 2px 3px;
      border: 0;
      border-radius: 4px;
      overflow: hidden;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .breadcrumb-link:hover {
      background: var(--tm-hover);
      color: var(--tm-text-soft);
    }

    .breadcrumb-link--document {
      color: var(--tm-text-soft);
      font-weight: 650;
    }

    .breadcrumb-separator {
      opacity: 0.55;
    }

    .topbar-actions {
      flex: 0 0 auto;
      gap: 4px;
    }

    .icon-button,
    .section-action,
    .property-chip,
    .attachment-action,
    .subtask-open,
    .remark-tool,
    .history-delete {
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      color: var(--tm-muted);
    }

    .icon-button:hover,
    .section-action:hover,
    .attachment-action:hover,
    .subtask-open:hover,
    .remark-tool:hover,
    .history-delete:hover {
      color: var(--tm-text);
      background: var(--tm-hover);
      border-color: var(--tm-border-soft);
    }

    .detail-content {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(28px, 5vw, 50px) clamp(20px, 6vw, 54px) max(56px, env(safe-area-inset-bottom));
    }

    .task-heading {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .task-check {
      appearance: none;
      width: 19px;
      height: 19px;
      margin: 7px 0 0;
      border: 1.7px solid color-mix(in oklch, var(--tm-muted) 72%, var(--tm-border));
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: var(--tm-background);
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .task-check::after {
      content: "";
      width: 8px;
      height: 4px;
      border: solid oklch(98% 0.004 236);
      border-width: 0 0 2px 2px;
      transform: translateY(-1px) rotate(-45deg) scale(0.45);
      opacity: 0;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .task-check:hover {
      border-color: var(--tm-primary);
      transform: scale(1.05);
    }

    .task-check:checked {
      border-color: var(--tm-primary);
      background: var(--tm-primary);
    }

    .task-check:checked::after {
      transform: translateY(-1px) rotate(-45deg) scale(1);
      opacity: 1;
    }

    .task-title {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--tm-text);
      background: transparent;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.34;
      word-break: break-word;
    }

    .task-title:focus {
      border-radius: 4px;
      box-shadow: 0 0 0 4px var(--tm-primary-soft);
    }

    .parent-line {
      margin: 9px 0 0 34px;
      color: var(--tm-muted);
      font-size: 12px;
    }

    .parent-line button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--tm-primary);
      cursor: pointer;
    }

    .property-band {
      margin: 24px 0 0 34px;
      padding: 0;
    }

    .property-list {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .property-chip {
      min-width: 0;
      min-height: 31px;
      max-width: 100%;
      padding: 0 9px;
      border-color: var(--tm-border-soft);
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--tm-background);
      color: var(--tm-text-soft);
      box-shadow: 0 1px 0 color-mix(in oklch, var(--tm-text) 3%, transparent);
      white-space: nowrap;
    }

    .property-chip:hover {
      border-color: color-mix(in oklch, var(--tm-primary) 30%, var(--tm-border));
      background: var(--tm-hover);
      color: var(--tm-text);
      transform: translateY(-1px);
    }

    .property-chip .chip-value {
      min-width: 0;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .property-chip--priority .icon {
      color: var(--tm-warning);
    }

    .property-chip--status .status-dot {
      width: 8px;
      height: 8px;
      border: 2px solid var(--tm-primary);
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px var(--tm-background);
      background: var(--tm-primary);
    }

    .property-chip--due {
      color: var(--tm-danger);
      border-color: color-mix(in oklch, var(--tm-danger) 18%, var(--tm-border));
      background: color-mix(in oklch, var(--tm-danger-soft) 48%, var(--tm-background));
    }

    .property-chip--tag .icon {
      color: oklch(56% 0.15 316);
    }

    .property-advanced {
      display: block;
    }

    .property-advanced-inner {
      min-height: 0;
      overflow: hidden;
    }

    .property-advanced .property-list {
      padding-top: 7px;
    }

    .detail-sections {
      margin-top: 30px;
      border-top: 1px solid var(--tm-border-soft);
    }

    .detail-section {
      border-bottom: 1px solid var(--tm-border-soft);
    }

    .section-heading {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-toggle {
      min-width: 0;
      min-height: 42px;
      margin-left: -8px;
      padding: 0 8px;
      border: 0;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--tm-text);
      cursor: pointer;
      text-align: left;
    }

    .section-toggle:hover {
      background: color-mix(in oklch, var(--tm-surface) 76%, transparent);
    }

    .section-chevron {
      width: 16px;
      height: 16px;
      color: var(--tm-muted);
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .section-toggle[aria-expanded="false"] .section-chevron {
      transform: rotate(-90deg);
    }

    .section-title {
      font-size: 14px;
      font-weight: 680;
      line-height: 1.2;
    }

    .section-count {
      color: var(--tm-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .section-actions {
      flex: 0 0 auto;
      gap: 4px;
    }

    .section-action,
    .attachment-action {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      color: var(--tm-muted);
    }

    .section-action.is-active {
      border-color: color-mix(in oklch, var(--tm-primary) 22%, var(--tm-border));
      background: var(--tm-primary-soft);
      color: var(--tm-primary);
    }

    .section-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 190ms cubic-bezier(0.16, 1, 0.3, 1), opacity 130ms ease;
    }

    .detail-section.is-collapsed .section-body {
      grid-template-rows: 0fr;
      opacity: 0;
    }

    .section-body-inner {
      min-height: 0;
      overflow: hidden;
    }

    .section-content {
      padding: 0 0 22px 24px;
    }

    .subtask-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .subtask-row {
      min-width: 0;
      min-height: 42px;
      margin-left: -8px;
      padding: 4px 4px 4px 8px;
      border-radius: 7px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: start;
      gap: 9px;
      transition: background-color 150ms ease;
    }

    .subtask-row:hover {
      background: color-mix(in oklch, var(--tm-surface) 82%, transparent);
    }

    .subtask-check {
      appearance: none;
      width: 16px;
      height: 16px;
      margin: 8px 0 0;
      border: 1.5px solid color-mix(in oklch, var(--tm-muted) 72%, var(--tm-border));
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--tm-background);
      cursor: pointer;
    }

    .subtask-check::after {
      content: "";
      width: 7px;
      height: 3px;
      border: solid oklch(98% 0.004 236);
      border-width: 0 0 2px 2px;
      transform: translateY(-1px) rotate(-45deg) scale(0.45);
      opacity: 0;
    }

    .subtask-check:checked {
      border-color: var(--tm-success);
      background: var(--tm-success);
    }

    .subtask-check:checked::after {
      transform: translateY(-1px) rotate(-45deg) scale(1);
      opacity: 1;
    }

    .subtask-copy {
      min-width: 0;
    }

    .subtask-title {
      display: block;
      width: 100%;
      min-height: 32px;
      padding: 5px 4px;
      border: 1px solid transparent;
      border-radius: 5px;
      outline: 0;
      resize: none;
      color: var(--tm-text-soft);
      background: transparent;
      line-height: 1.35;
      overflow: hidden;
    }

    .subtask-title:hover {
      border-color: var(--tm-border-soft);
      background: var(--tm-background);
    }

    .subtask-title:focus {
      border-color: color-mix(in oklch, var(--tm-primary) 40%, var(--tm-border));
      background: var(--tm-background);
      box-shadow: 0 0 0 3px var(--tm-primary-soft);
    }

    .subtask-check:checked + .subtask-copy .subtask-title {
      color: var(--tm-muted);
      text-decoration: line-through;
    }

    .subtask-trailing {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .subtask-open {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      color: var(--tm-muted);
    }

    .subtask-add {
      min-height: 34px;
      margin: 5px 0 0 -5px;
      padding: 0 6px;
      border: 0;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      color: var(--tm-muted);
      cursor: pointer;
    }

    .subtask-add:hover {
      background: var(--tm-hover);
      color: var(--tm-primary);
    }

    .remark-wrap {
      border: 1px solid var(--tm-border-soft);
      border-radius: 7px;
      overflow: hidden;
      background: color-mix(in oklch, var(--tm-background) 88%, var(--tm-surface));
    }

    .remark-toolbar {
      min-height: 38px;
      padding: 3px 5px;
      border-bottom: 1px solid var(--tm-border-soft);
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .remark-toolbar::-webkit-scrollbar {
      display: none;
    }

    .remark-toolbar[hidden] {
      display: none;
    }

    .remark-tool {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      padding: 0;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      color: var(--tm-muted);
      font-size: 12px;
      font-weight: 650;
    }

    .remark-tool--italic {
      font-style: italic;
      font-family: Georgia, serif;
      font-size: 15px;
    }

    .remark-tool--quote {
      font-family: Georgia, serif;
      font-size: 18px;
    }

    .remark-textarea,
    .custom-textarea {
      width: 100%;
      border: 0;
      outline: 0;
      resize: vertical;
      color: var(--tm-text-soft);
      background: transparent;
      line-height: 1.65;
    }

    .remark-textarea {
      min-height: 132px;
      padding: 13px 14px 15px;
    }

    .custom-textarea {
      min-height: 76px;
      padding: 11px 12px;
      border: 1px solid var(--tm-border-soft);
      border-radius: 7px;
      background: color-mix(in oklch, var(--tm-background) 88%, var(--tm-surface));
    }

    .remark-textarea:focus,
    .custom-textarea:focus {
      box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--tm-primary) 48%, var(--tm-border));
    }

    .attachment-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .attachment-row {
      min-width: 0;
      padding: 10px 10px 10px 12px;
      border: 1px solid var(--tm-border-soft);
      border-radius: 7px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      background: color-mix(in oklch, var(--tm-surface) 68%, var(--tm-background));
    }

    .attachment-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--tm-primary);
      background: var(--tm-primary-soft);
    }

    .attachment-icon--image {
      color: oklch(58% 0.12 156);
      background: color-mix(in oklch, oklch(93% 0.035 156) 70%, var(--tm-background));
    }

    .attachment-copy {
      width: 100%;
      min-width: 0;
      padding: 2px 0;
      border: 0;
      overflow: hidden;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .attachment-copy:hover .attachment-name {
      color: var(--tm-primary);
    }

    .attachment-name {
      display: block;
      overflow: hidden;
      color: var(--tm-text-soft);
      font-weight: 550;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-meta {
      display: block;
      margin-top: 1px;
      color: var(--tm-muted);
      font-size: 11px;
    }

    .attachment-actions {
      display: inline-flex;
      gap: 2px;
    }

    .attachment-list.is-drop-target {
      outline: 2px solid color-mix(in oklch, var(--tm-primary) 42%, transparent);
      outline-offset: 5px;
      border-radius: 5px;
    }

    .attachment-action:disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    .history-list {
      position: relative;
      padding-left: 5px;
    }

    .history-list::before {
      content: "";
      position: absolute;
      top: 16px;
      bottom: 16px;
      left: 18px;
      width: 1px;
      background: var(--tm-border-soft);
    }

    .history-row {
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 13px;
      padding: 7px 0 15px;
    }

    .history-icon {
      position: relative;
      z-index: 1;
      width: 28px;
      height: 28px;
      border: 1px solid var(--tm-border-soft);
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: var(--tm-muted);
      background: var(--tm-background);
    }

    .history-copy {
      min-width: 0;
      padding-top: 3px;
      color: var(--tm-text-soft);
      word-break: break-word;
    }

    .history-time {
      display: block;
      margin-top: 3px;
      color: var(--tm-muted);
      font-size: 11px;
    }

    .history-detail {
      display: block;
      margin-top: 3px;
      color: var(--tm-muted);
      font-size: 11px;
    }

    .history-delete {
      min-height: 28px;
      padding: 0 7px;
      border-radius: 6px;
      align-self: start;
      color: var(--tm-muted);
      font-size: 12px;
    }

    .history-delete:hover {
      color: var(--tm-danger);
      background: var(--tm-danger-soft);
      border-color: color-mix(in oklch, var(--tm-danger) 18%, var(--tm-border));
    }

    .mobile-save {
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 50;
      min-height: 34px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 7px 12px;
      border: 1px solid var(--tm-border);
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--tm-text);
      color: var(--tm-background);
      box-shadow: var(--tm-shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 170ms ease, transform 170ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1120px) {
      .app-frame {
        grid-template-columns: minmax(92px, 1fr) minmax(620px, 820px) minmax(92px, 1fr);
      }

      .ambient-mark span {
        display: none;
      }
    }

    @media (max-width: 760px) {
      body {
        background: var(--tm-background);
      }

      .app-frame {
        display: block;
        background: var(--tm-background);
      }

      .ambient-pane {
        display: none;
      }

      .detail-sheet {
        min-height: 100vh;
        min-height: 100dvh;
        border: 0;
        box-shadow: none;
      }

      .sheet-topbar {
        padding-inline: 10px;
      }

      .breadcrumb > span:first-child,
      .breadcrumb > .breadcrumb-separator:last-of-type,
      .breadcrumb-link--heading {
        display: none;
      }

      .detail-content {
        width: 100%;
        padding: 26px 18px max(82px, calc(24px + env(safe-area-inset-bottom)));
      }

      .task-title {
        font-size: 22px;
        line-height: 1.36;
      }

      .property-band {
        margin-top: 20px;
        margin-inline: 0;
        padding: 0;
      }

      .parent-line {
        margin-left: 0;
      }

      .property-chip {
        max-width: 100%;
      }

      .detail-sections {
        margin-top: 26px;
      }

      .section-heading {
        min-height: 56px;
      }

      .section-content {
        padding-left: 16px;
      }

      .mobile-save {
        display: none;
      }
    }

    @media (max-width: 430px) {
      .detail-content {
        padding-inline: 15px;
      }

      .task-heading {
        grid-template-columns: 20px minmax(0, 1fr);
        gap: 10px;
      }

      .task-check {
        margin-top: 6px;
      }

      .task-title {
        font-size: 20px;
      }

      .breadcrumb {
        display: none;
      }

      .topbar-leading {
        flex: 0 0 auto;
      }

      .property-list {
        gap: 6px;
      }

      .property-chip {
        min-height: 32px;
        padding-inline: 8px;
        font-size: 13px;
      }

      .section-content {
        padding-left: 8px;
      }

      .attachment-row {
        grid-template-columns: 28px minmax(0, 1fr);
        grid-template-areas:
          "icon copy"
          ". actions";
        gap: 8px;
        padding-left: 9px;
      }

      .attachment-icon {
        grid-area: icon;
        width: 28px;
        height: 28px;
      }

      .attachment-copy {
        grid-area: copy;
      }

      .attachment-actions {
        grid-area: actions;
        justify-self: end;
        justify-content: flex-end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

                    <div class="history-row">
                      <span class="history-icon"><svg class="icon"><use href="#i-calendar"/></svg></span>
                      <span class="history-copy">第 3/8 次 · 完成于 8 月 1 日 18:42<span class="history-detail">本次：8 月 1 日 · 已推进到：8 月 7 日</span><span class="history-time">2 天前</span></span>

                      <span class="history-copy">第 2/8 次 · 完成于 7 月 25 日 17:10<span class="history-detail">本次：7 月 25 日 · 已推进到：8 月 1 日</span><span class="history-time">9 天前</span></span>

                      <span class="history-copy">第 1/8 次 · 完成于 7 月 18 日 16:28<span class="history-detail">本次：7 月 18 日 · 已推进到：7 月 25 日</span><span class="history-time">16 天前</span></span>

    <aside class="ambient-pane ambient-pane--right" aria-hidden="true">

  <div class="toast" role="status" aria-live="polite" data-toast>
    <svg class="icon"><use href="#i-save"/></svg><span>已保存</span>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const toast = document.querySelector('[data-toast]');
      let toastTimer = 0;

      const showToast = (message, icon = 'save') => {
        if (!toast) return;
        toast.querySelector('span').textContent = message;
        toast.querySelector('use').setAttribute('href', `#i-${icon}`);
        toast.classList.add('is-visible');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1500);
      };

      const storedTheme = localStorage.getItem('tm-detail-prototype-theme');
      const initialTheme = storedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.dataset.theme = initialTheme;

      const syncThemeIcon = () => {
        const use = document.querySelector('.theme-icon use');
        if (use) use.setAttribute('href', root.dataset.theme === 'dark' ? '#i-sun' : '#i-moon');
      };
      syncThemeIcon();

      document.querySelectorAll('.section-toggle').forEach((button) => {
        const section = button.closest('[data-section]');
        if (!section) return;
        const key = `tm-detail-section-${section.dataset.section}`;
        const stored = localStorage.getItem(key);
        const collapsed = stored
          ? stored === 'collapsed'
          : section.dataset.defaultCollapsed === 'true';
        const body = section.querySelector('.section-body');
        section.classList.toggle('is-collapsed', collapsed);
        button.setAttribute('aria-expanded', String(!collapsed));
        body?.setAttribute('aria-hidden', String(collapsed));
        if (body) body.inert = collapsed;

        button.addEventListener('click', () => {
          const nextCollapsed = !section.classList.contains('is-collapsed');
          section.classList.toggle('is-collapsed', nextCollapsed);
          button.setAttribute('aria-expanded', String(!nextCollapsed));
          body?.setAttribute('aria-hidden', String(nextCollapsed));
          if (body) body.inert = nextCollapsed;
          localStorage.setItem(key, nextCollapsed ? 'collapsed' : 'expanded');
        });
      });

      const updateSubtaskCount = () => {
        const all = [...document.querySelectorAll('.subtask-check')];
        const completed = all.filter((item) => item.checked).length;
        const count = document.querySelector('[data-subtask-count]');
        if (count) count.textContent = `${completed}/${all.length}`;
      };

      const resizeSubtaskTextareas = () => {
        document.querySelectorAll('.subtask-title').forEach((textarea) => {
          textarea.style.height = 'auto';
          textarea.style.height = `${textarea.scrollHeight + 1}px`;
        });
      };

      document.querySelectorAll('.subtask-title').forEach((textarea) => {
        textarea.addEventListener('input', resizeSubtaskTextareas);
      });
      resizeSubtaskTextareas();
      window.addEventListener('resize', () => window.requestAnimationFrame(resizeSubtaskTextareas), { passive: true });

      document.querySelectorAll('.subtask-check').forEach((checkbox) => {
        checkbox.addEventListener('change', () => {
          updateSubtaskCount();
          const completedToggle = document.querySelector('[data-action="toggle-completed"]');
          if (checkbox.checked && completedToggle?.getAttribute('aria-pressed') === 'false') {
            checkbox.closest('.subtask-row').hidden = true;
          }
        });
      });

      const detailTitle = document.querySelector('.task-title');
      const parentButton = document.querySelector('[data-action="open-parent"]');
      const detailStack = [];

      const openTaskDetail = (nextTitle, message) => {
        if (!detailTitle || !nextTitle) return;
        detailStack.push({ title: detailTitle.textContent, parent: parentButton?.textContent || '' });
        if (parentButton) parentButton.textContent = detailTitle.textContent;
        detailTitle.textContent = nextTitle;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(message, 'chevron-right');
      };

      const remarkEditor = document.querySelector('[data-remark-editor]');
      const replaceRemarkSelection = (replacement, from, to, selectionStart, selectionEnd) => {
        if (!remarkEditor) return;
        remarkEditor.setRangeText(replacement, from, to, 'preserve');
        remarkEditor.focus();
        remarkEditor.setSelectionRange(selectionStart, selectionEnd);
        remarkEditor.dispatchEvent(new Event('input', { bubbles: true }));
      };

      document.querySelector('[data-remark-toolbar]')?.addEventListener('click', (event) => {
        const tool = event.target.closest('[data-remark-tool]')?.dataset.remarkTool;
        if (!tool || !remarkEditor) return;
        const value = remarkEditor.value;
        const start = remarkEditor.selectionStart;
        const end = remarkEditor.selectionEnd;
        const selected = value.slice(start, end);
        const wrappers = { bold: '**', italic: '*', code: '`' };

        if (wrappers[tool]) {
          const marker = wrappers[tool];
          const content = selected || (tool === 'code' ? '代码' : '文本');
          const replacement = `${marker}${content}${marker}`;
          replaceRemarkSelection(replacement, start, end, start + marker.length, start + marker.length + content.length);
          return;
        }

        if (tool === 'link') {
          const label = selected || '链接文字';
          const replacement = `[${label}](https://)`;
          const urlStart = start + label.length + 3;
          replaceRemarkSelection(replacement, start, end, urlStart, urlStart + 8);
          return;
        }

        const lineStart = value.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
        const nextBreak = value.indexOf('\n', end);
        const lineEnd = nextBreak === -1 ? value.length : nextBreak;
        const lines = value.slice(lineStart, lineEnd).split('\n');
        const transformed = lines.map((line, index) => {
          if (tool === 'outdent') return line.replace(/^( {1,2}|\t)/, '');
          if (tool === 'indent') return `  ${line}`;
          if (tool === 'bullet') return `- ${line}`;
          if (tool === 'ordered') return `${index + 1}. ${line}`;
          if (tool === 'quote') return `> ${line}`;
          return line;
        }).join('\n');
        replaceRemarkSelection(transformed, lineStart, lineEnd, lineStart, lineStart + transformed.length);
      });

      const attachmentList = document.querySelector('[data-attachment-list]');
      const syncAttachmentControls = () => {
        const rows = [...document.querySelectorAll('.attachment-row')];
        rows.forEach((row, index) => {
          const up = row.querySelector('[data-direction="up"]');
          const down = row.querySelector('[data-direction="down"]');
          if (up) up.disabled = index === 0;
          if (down) down.disabled = index === rows.length - 1;
        });
        const count = document.querySelector('[data-section="attachments"] .section-count');
        if (count) count.textContent = String(rows.length);
      };

      attachmentList?.addEventListener('dragover', (event) => {
        event.preventDefault();
        attachmentList.classList.add('is-drop-target');
      });
      attachmentList?.addEventListener('dragleave', () => attachmentList.classList.remove('is-drop-target'));
      attachmentList?.addEventListener('drop', (event) => {
        event.preventDefault();
        attachmentList.classList.remove('is-drop-target');
        showToast('已接收拖放附件', 'paperclip');
      });
      document.addEventListener('paste', (event) => {
        if (event.clipboardData?.files?.length) showToast('已接收粘贴附件', 'paperclip');
      });

      document.querySelector('[data-subtask-list]')?.addEventListener('contextmenu', (event) => {
        const row = event.target.closest('.subtask-row');
        if (!row) return;
        event.preventDefault();
        showToast(`子任务菜单 · ${row.dataset.subtaskId}`, 'more');
      });

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        const action = target?.dataset.action;
        if (!action) return;
        if (action === 'theme') {
          root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('tm-detail-prototype-theme', root.dataset.theme);
          syncThemeIcon();
        }
        if (action === 'save') showToast('已保存');
        if (action === 'note') showToast('已切换到笔记内视图', 'book-open');
        if (action === 'add-subtask') showToast('新建子任务', 'plus');
        if (action === 'attach') showToast('选择附件', 'paperclip');
        if (action === 'more') showToast('更多任务操作', 'more');
        if (action === 'jump') showToast('已跳转到任务块', 'map-pin');
        if (action === 'close') showToast('已关闭任务详情', 'x');
        if (action === 'open-location') showToast(`打开${target.dataset.location}`, 'book-open');
        if (action === 'edit-property') showToast(`编辑${target.dataset.property}`, 'more');
        if (action === 'open-subtask') openTaskDetail(target.dataset.taskTitle, '已打开子任务详情');
        if (action === 'open-parent') openTaskDetail(target.textContent.trim(), '已打开父任务详情');

        if (action === 'back') {
          const previous = detailStack.pop();
          if (previous && detailTitle) {
            detailTitle.textContent = previous.title;
            if (parentButton) parentButton.textContent = previous.parent;
            showToast('已返回上一任务', 'arrow-left');
          } else {
            showToast('返回任务列表', 'arrow-left');
          }
        }

        if (action === 'toggle-completed') {
          const showCompleted = target.getAttribute('aria-pressed') !== 'true';
          target.setAttribute('aria-pressed', String(showCompleted));
          target.classList.toggle('is-active', showCompleted);
          target.title = showCompleted ? '隐藏已完成子任务' : '显示已完成子任务';
          target.setAttribute('aria-label', target.title);
          document.querySelectorAll('.subtask-row').forEach((row) => {
            row.hidden = !showCompleted && row.querySelector('.subtask-check')?.checked;
          });
        }

        if (action === 'remark-tools') {
          const toolbar = document.querySelector('[data-remark-toolbar]');
          const visible = target.getAttribute('aria-pressed') !== 'true';
          target.setAttribute('aria-pressed', String(visible));
          target.classList.toggle('is-active', visible);
          target.title = visible ? '隐藏格式工具' : '显示格式工具';
          target.setAttribute('aria-label', target.title);
          if (toolbar) toolbar.hidden = !visible;
        }

        if (action === 'open-attachment') {
          const name = target.closest('.attachment-row')?.dataset.attachment;
          showToast(`打开附件 · ${name}`, 'paperclip');
        }

        if (action === 'move-attachment') {
          const row = target.closest('.attachment-row');
          const sibling = target.dataset.direction === 'up' ? row?.previousElementSibling : row?.nextElementSibling;
          if (row && sibling) {
            if (target.dataset.direction === 'up') attachmentList.insertBefore(row, sibling);
            else attachmentList.insertBefore(sibling, row);
            syncAttachmentControls();
            showToast('已调整附件顺序', 'paperclip');
          }
        }

        if (action === 'remove-attachment') {
          target.closest('.attachment-row')?.remove();
          syncAttachmentControls();
          showToast('已移除附件', 'trash');
        }

        if (action === 'delete-history') {
          target.closest('.history-row')?.remove();
          const rows = document.querySelectorAll('.history-row');
          const count = document.querySelector('[data-section="history"] .section-count');
          if (count) count.textContent = String(rows.length);
          showToast('已删除重复记录', 'trash');
        }
      });

      document.querySelector('.task-check')?.addEventListener('change', (event) => {
        showToast(event.target.checked ? '任务已完成' : '任务已恢复');
      });

      updateSubtaskCount();
      syncAttachmentControls();
    })();
  </script>
</body>
