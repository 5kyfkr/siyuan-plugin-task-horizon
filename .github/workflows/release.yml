name: release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    steps:
      - uses: actions/checkout@v4
      - name: Cache test dependencies and Chromium
        uses: actions/cache@v4
        with:
          path: |
            /tmp/task-horizon-release-tests-1.63.0
            ~/.cache/ms-playwright
            ~/.cache/task-horizon-fonts
          key: ${{ runner.os }}-task-horizon-playwright-1.63.0
      - name: Restore test fonts
        run: |
          archive="$HOME/.cache/task-horizon-fonts/fonts.tgz"
          if [ -s "$archive" ]; then sudo tar xzf "$archive" -C / && sudo fc-cache -f >/dev/null; fi
      - name: Verify
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/verify-release.ps1
      - name: Package
        run: pwsh -ExecutionPolicy Bypass -File ./build.ps1
      - name: Verify packaged artifact and languages
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/verify-package.ps1
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
